# Volle Skill-Suite bei GitHub Actions (#537): Linux blockiert, Windows nur Anzeige (#68).
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows nur Anzeige, bis #68 abgearbeitet ist.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # wie auf dem Bau-Server
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: tmux installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux

      - name: Test-Abhängigkeiten
        run: python -m pip install -r tests/requirements.txt

      - name: git-Identität für Tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: pytest
        run: |
          start=$(date +%s)
          set +e
          python -m pytest tests -q -n auto -p no:cacheprovider --junitxml=junit.xml
          code=$?
          echo "LAUFZEIT_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $code

      - name: Zusammenfassung
        if: always()
        run: python .github/workflows/junit_zusammenfassung.py junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: JUnit-Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: junit.xml
          if-no-files-found: warn
