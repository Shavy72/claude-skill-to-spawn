# Wiederverwendbare Pipeline-Vorlage Stufe 3 (#581, #800).
# Zielbild der Pipeline-Vorlage (#581, #797):
# - Triage neuer Befunde und Tickets vor dem Bau.
# - Risikoarme Fixes gehen bei grüner CI automatisch durch.
# - Restliche Änderungen gehen nur per Beweis (Prüf-Beleg / Freigabe) weiter.
# - Nächtliche Audits (Stufe 3 / Nachtrunde) prüfen Qualität, Wackler und Mutationen.
# Rolle des Bau-Servers:
# - Ausschließlich Claude-Sessions und 'braucht Server'-Tests (@pytest.mark.braucht('server') / braucht_server).
# - Alle übrigen Tests und Stufe-2-Komplettläufe laufen verteilt auf GitHub Actions (>= 2 Runner).
# Stufe 3 (wöchentliches Aufräumen ohne Feature-Bau — erzeugt ausschließlich Vorschläge):
# - Doppelte-/Überdeckt-Vorschläge mit unverbrüchlicher Schutzliste (Nutzer-Ablauf, echter Fund)
#   und technischer Zweitprüfer-Sperre (Löschen erst nach Nachweis eines zweiten unabhängigen Agenten).
# - Wackler-Quarantäne-Ledger und Meldung langsamster Tests (Teil 2, #798).
# - Diff-Mutationstest mit mutmut ausschließlich auf geändertem Produktivcode (Teil 3, #799, nur Linux).
name: Pipeline Stufe 3 (Wöchentliches Aufräumen — nur Vorschläge)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python-Version für die wöchentlichen Stufe-3-Runner."
        required: false
        type: string
        default: "3.13"
      test-pfade:
        description: "Test-Wurzelordner oder Test-Pfade für Doppelte-Vorschläge (leerzeichengetrennt)."
        required: false
        type: string
        default: "tests"
      anforderungen:
        description: "Pfad zu pip-Abhängigkeiten für Tests (optional für Diff-Mutationstest)."
        required: false
        type: string
        default: "tests/requirements.txt"
      basis-ref:
        description: "Git-Basis-Ref für den Diff-Mutationstest (leer = automatisch letzter Merge/HEAD~1)."
        required: false
        type: string
        default: ""
      junit-pfad:
        description: "Optionaler Pfad zu JUnit-XML-Dateien oder einem Ordner für die Meldung langsamster Tests."
        required: false
        type: string
        default: ""
      wackler-schwelle:
        description: "Mindestanzahl Wackler-Treffer für einen Quarantäne-Vorschlag."
        required: false
        type: number
        default: 2
      wackler-fenster-tage:
        description: "Zeitfenster in Tagen für die Wackler-Auswertung (0 = gesamter Verlauf)."
        required: false
        type: number
        default: 14
      langsamste-top:
        description: "Anzahl der gemeldeten langsamsten Tests (Top-N)."
        required: false
        type: number
        default: 10
      mutation-aktiv:
        description: "Diff-Mutationstest (mutmut, nur Linux) in der Stufe-3-Runde ausführen."
        required: false
        type: boolean
        default: true
      pfad-filter:
        description: "Optionale Pfad-Filter für den Diff-Mutationstest (leerzeichengetrennt)."
        required: false
        type: string
        default: ""
      ersteller-agent:
        description: "Kennung des Aufräum-Agenten (für die Zweitprüfer-Sperre gegen Selbst-Freigabe)."
        required: false
        type: string
        default: "stufe3-aufraeum-agent"
      skill-pfad:
        description: "Pfad zum Skill-Repo im Runner (Eigenanschluss '.', Fremdrepo z. B. '.to-spawn-skill')."
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  doppelte-vorschlaege:
    name: Stufe 3 Doppelte-Vorschläge & Schutzliste (nur Vorschläge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python-version }}"

      - name: Doppelte und überdeckte Test-Kandidaten melden (nur Vorschläge)
        env:
          SKILL_PFAD: ${{ inputs.skill-pfad }}
          TEST_PFADE: ${{ inputs.test-pfade }}
          ERSTELLER_AGENT: ${{ inputs.ersteller-agent }}
        run: |
          args=(--repo . --ersteller-agent "$ERSTELLER_AGENT" --ausgabe-json "$RUNNER_TEMP/stufe3-doppelte.json" --summary-pfad "$GITHUB_STEP_SUMMARY")
          [ -n "$TEST_PFADE" ] && args+=(--test-pfade "$TEST_PFADE")
          PYTHONPATH="${SKILL_PFAD}:${PYTHONPATH:-}" python -m to_spawn.pruef.aufraeumen doppelte "${args[@]}"

      - name: Vorschlags-Artefakt (Doppelte) hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stufe3-doppelte-vorschlaege
          path: ${{ runner.temp }}/stufe3-doppelte.json
          if-no-files-found: ignore

  quarantaene-langsamste:
    name: Stufe 3 Wackler-Quarantäne & langsamste Tests (nur Vorschläge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python-version }}"

      - name: Quarantäne-Vorschläge und langsamste Tests erzeugen
        env:
          SKILL_PFAD: ${{ inputs.skill-pfad }}
          JUNIT_PFAD: ${{ inputs.junit-pfad }}
          WACKLER_SCHWELLE: ${{ inputs.wackler-schwelle }}
          WACKLER_FENSTER: ${{ inputs.wackler-fenster-tage }}
          LANGSAMSTE_TOP: ${{ inputs.langsamste-top }}
        run: |
          args=(--repo . --schwelle "$WACKLER_SCHWELLE" --fenster-tage "$WACKLER_FENSTER" --top "$LANGSAMSTE_TOP" --nur-pruefen --ausgabe-json "$RUNNER_TEMP/stufe3-quarantaene.json" --summary-pfad "$GITHUB_STEP_SUMMARY")
          if [ -n "$JUNIT_PFAD" ] && [ -e "$JUNIT_PFAD" ]; then
            args+=(--junit "$JUNIT_PFAD")
          fi
          PYTHONPATH="${SKILL_PFAD}:${PYTHONPATH:-}" python -m to_spawn.pruef.quarantaene bericht "${args[@]}"

      - name: Vorschlags-Artefakt (Quarantäne & Langsamste) hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stufe3-quarantaene-langsamste
          path: ${{ runner.temp }}/stufe3-quarantaene.json
          if-no-files-found: ignore

  diff-mutation:
    name: Stufe 3 Diff-Mutationstest (mutmut, nur Linux)
    if: ${{ inputs.mutation-aktiv }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ inputs.python-version }}"

      - name: Werkzeuge für Diff-Mutationstest installieren
        env:
          ANFORDERUNGEN: ${{ inputs.anforderungen }}
        run: |
          python -m pip install -q pytest mutmut
          if [ -n "$ANFORDERUNGEN" ] && [ -f "$ANFORDERUNGEN" ]; then
            python -m pip install -q -r "$ANFORDERUNGEN"
          fi

      - name: Basis-Ref für Diff-Mutationstest bestimmen
        env:
          EINGABE_BASIS: ${{ inputs.basis-ref }}
        run: |
          if [ -n "$EINGABE_BASIS" ]; then
            BASIS="$EINGABE_BASIS"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            BASIS="HEAD~1"
          else
            BASIS="HEAD"
          fi
          echo "BASIS_REF=$BASIS" >> "$GITHUB_ENV"

      - name: Diff-Mutationstest ausführen (nur Bericht/Vorschläge)
        continue-on-error: true
        env:
          SKILL_PFAD: ${{ inputs.skill-pfad }}
          PFAD_FILTER: ${{ inputs.pfad-filter }}
        run: |
          args=(--repo . --basis "$BASIS_REF" --ziel HEAD --zusammenfassung "$GITHUB_STEP_SUMMARY" --json)
          if [ -n "$PFAD_FILTER" ]; then
            # shellcheck disable=SC2206
            filter_arr=($PFAD_FILTER)
            args+=(--pfad-filter "${filter_arr[@]}")
          fi
          PYTHONPATH="${SKILL_PFAD}:${PYTHONPATH:-}" python -m to_spawn.pruef.mutation "${args[@]}" > "$RUNNER_TEMP/stufe3-mutation.json"

      - name: Vorschlags-Artefakt (Diff-Mutationstest) hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stufe3-diff-mutation
          path: ${{ runner.temp }}/stufe3-mutation.json
          if-no-files-found: ignore
